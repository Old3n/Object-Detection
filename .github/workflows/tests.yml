name: Tests

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q AutoPilot.py adas tests tools ModelBenchmark.py RiskVideoBenchmark.py VideoBenchmark.py SurroundCameraBenchmark.py EvaluateModel.py train_pedestrian_model.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --check web/sw.js
